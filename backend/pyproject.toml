[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield-backend"
version = "0.1.0"
description = "Scam Shield: real-time scam-call risk engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.1",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "indic-transliteration==2.3.82",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "onnx>=1.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# Line length is enforced by `ruff format`; long strings/comments it can't wrap are allowed.
ignore = ["E501"]
