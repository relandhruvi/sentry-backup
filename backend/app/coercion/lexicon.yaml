  - {p: "never ask for your otp", w: 0.6}
  - {p: "never ask for your pin", w: 0.6}
  - {p: "otp kisi ke saath share mat kijiye", w: 0.6}
  - {p: "ओटीपी किसी को मत बताइए", w: 0.6}
  - {p: "call us back on the number", w: 0.6}
  - {p: "number printed on the back of your card", w: 0.7}
  - {p: "official website", w: 0.3}
  - {p: "visit your branch", w: 0.5}
  - {p: "visit the branch", w: 0.5}
  - {p: "visit branch", w: 0.5}
  - {p: "go to your branch", w: 0.5}
  - {p: "call the number on your card", w: 0.7}
  - {p: "number on the back of your card", w: 0.7}
  - {p: "do not share your otp", w: 0.6}
  - {p: "do not share otp", w: 0.6}
  - {p: "branch aa jaiye", w: 0.4}
  - {p: "with your son", w: 0.4}
  - {p: "beta ko bhi saath le aaiye", w: 0.5}
  - {p: "बेटे को भी साथ ले आइए", w: 0.5}
  - {p: "family ko bata dijiye", w: 0.5}
