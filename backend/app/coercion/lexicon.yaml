# Coercion lexicon: weighted cues for 7 tactics, plus protective cues and negation scope.
#
# Patterns are written in natural spelling. At load time each one is passed through
# app/text/normalize.py (romanize Devanagari, phonetic key, spelling variants), the same function
# applied to live transcripts, then fuzzy-matched with rapidfuzz.
#
# Describe tactics, not specific calls: a pattern must be something many different scams (or
# benign callers, for protective cues) would plausibly say. Weight = how strongly the phrase alone
# indicates the tactic (0-1). Forms: English, Devanagari Hindi, romanized Hinglish, and Devanagari
# spellings of English terms (Whisper writes romanized Hinglish speech in Devanagari).

