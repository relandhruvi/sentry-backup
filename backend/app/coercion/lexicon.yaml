  - {p: "take your time", w: 0.4}
  - {p: "we have already blocked the card", w: 0.4}

# Negation: a PAYMENT/CREDENTIAL hit with a negation token just before (or after) it is advice,
# not a demand ("the bank will never ask for your OTP"). Not applied to SECRECY/ISOLATION, whose
# patterns contain the negation themselves ("kisi ko mat batana").
negation:
  tokens: ["never", "not", "no", "dont", "don", "nahi", "nahin", "mat", "kabhi", "नहीं", "मत", "कभी"]
  window_before: 4
  window_after: 2
  # PROTECTIVE too: "do not discuss it with your family" is the opposite of protective advice.
  applies_to: [PAYMENT, CREDENTIAL, PROTECTIVE]
