# Trusted official sources for verification.
#
# PRIVACY RULE: only institutions in this file are ever searched online, and only by their
# `name` (never what the person typed). A domain is used only when `confirmed: true`, i.e. an
# official source confirms it:
#   - banks (public sector, private, small finance, payments): RBI "Banks in India"
#     (https://www.rbi.org.in/commonperson/English/Scripts/BanksInIndia.aspx), checked 2026-10-20
#   - NPCI: RBI "Important Websites"
#   - government bodies: the gov.in / nic.in registries are restricted to the Government of India
#   - couriers: CBIC's register of authorised couriers; telecom operators: TRAI pages
# Unconfirmed domains (former bank domains before the .bank.in move, bluedart.com, ...) are listed
# with `confirmed: false` and are never searched. Re-check banks against RBI with
# `make check-sources`. Foreign banks and regional rural banks are not listed yet.

