    lang: hinglish
    text: "आप जल्दी hospital आ जाइए और अपने बेटे को भी साथ ले आइए। Reception पर आकर form भर दीजिए।"
  - speaker: elder
    lang: hinglish
    text: "Theek hai, main aadhe ghante mein pahunch raha hoon."
